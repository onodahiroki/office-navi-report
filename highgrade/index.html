<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハイグレードオフィスビル 比較ダッシュボード｜オフィスナビ</title>
<style>
:root {
  --bg-main: #f1f5f9;
  --bg-card: #ffffff;
  --bg-card2: #ffffff;
  --accent: #db2777;
  --accent2: #e879a0;
  --navy: #1e3a8a;
  --blue: #2563eb;
  --text: #1e293b;
  --text-muted: #64748b;
  --border: rgba(0,0,0,0.08);
  --border-accent: rgba(219,39,119,0.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans','Meiryo',sans-serif;
  background: #dde3ec;
  color: var(--text); min-height: 100vh;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
  border-bottom: 3px solid #db2777;
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.header-title { font-size: 1.1rem; font-weight: 700; color: #fff; }
.header-title span {
  background: linear-gradient(135deg, #fda4c8, #f472b6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-badge {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 20px; padding: 4px 14px;
  font-size: 0.78rem; font-weight: 600; color: #fff;
}

/* CONTROLS */
.controls {
  background: #ffffff;
  border-bottom: 2px solid #e2e8f0;
  padding: 14px 24px;
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  position: sticky; top: 57px; z-index: 49;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
}
.control-group { display: flex; align-items: center; gap: 8px; }
.control-group label { font-size: 0.9rem; color: #1e3a8a; white-space: nowrap; font-weight: 700; letter-spacing: 0.01em; }
.controls input[type=text] {
  padding: 8px 12px; border: 1.5px solid #cbd5e1;
  border-radius: 8px; font-size: 0.9rem;
  background: #f8fafc; color: var(--text); width: 200px;
  transition: border-color .15s, box-shadow .15s;
}
.controls input[type=text]::placeholder { color: #94a3b8; }
.controls input[type=text]:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
.controls select {
  padding: 8px 12px; border: 1.5px solid #cbd5e1;
  border-radius: 8px; font-size: 0.9rem;
  background: #f8fafc; color: var(--text);
  cursor: pointer; transition: border-color .15s;
}
.controls select:focus { outline: none; border-color: #2563eb; }
.btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.88rem; font-weight: 700; transition: opacity .15s; }
.btn-reset { background: #f1f5f9; color: #475569; border: 1.5px solid #cbd5e1; }
.btn-reset:hover { background: #e2e8f0; }
.btn-compare {
  background: linear-gradient(135deg, #e879a0, #db2777);
  color: #fff; margin-left: auto;
  box-shadow: 0 2px 8px rgba(219,39,119,0.25);
}
.controls-break { flex-basis: 100%; height: 0; }
.btn-compare:hover { opacity: 0.9; }
.btn-compare:disabled { background: #e2e8f0; color: #94a3b8; cursor: default; box-shadow: none; }
.result-count { font-size: 0.88rem; color: #475569; font-weight: 600; }

/* GRID */
.grid-wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

/* CARD */
.card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 14px; overflow: hidden;
  transition: transform .2s, box-shadow .2s, border-color .2s;
  display: flex; flex-direction: column;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 28px rgba(0,0,0,0.10);
  border-color: #cbd5e1;
}
.card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(219,39,119,0.2);
}

/* CARD HEADER */
.card-header {
  padding: 13px 15px 10px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  display: flex; align-items: flex-start; gap: 10px;
}
.card-header-info { flex: 1; }
.area-badges { display: flex; gap: 6px; margin-bottom: 6px; }
.badge-area1 { display: none; }
.badge-area2 {
  background: rgba(37,99,235,0.1); color: #1d4ed8;
  border: 1px solid rgba(37,99,235,0.2);
  padding: 2px 9px; border-radius: 10px; font-size: 0.7rem; font-weight: 700;
}
.card-name { font-size: 0.97rem; font-weight: 700; color: #1e293b; line-height: 1.3; }
.card-name-en { font-size: 0.68rem; color: #94a3b8; margin-top: 2px; }
.checkbox-compare { width: 17px; height: 17px; cursor: pointer; accent-color: var(--accent); margin-top: 4px; flex-shrink: 0; }

/* CARD BODY */
.card-body { padding: 13px 15px; flex: 1; }
.card-desc { font-size: 0.82rem; color: #475569; line-height: 1.55; margin-bottom: 10px; }

.station-row {
  display: flex; align-items: flex-start; gap: 5px;
  font-size: 0.78rem; color: #64748b; margin-bottom: 10px;
}

.spec-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px; margin-bottom: 10px;
}
.spec-item {
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  border-radius: 8px; padding: 7px 10px;
}
.spec-label { font-size: 0.65rem; color: #1d4ed8; margin-bottom: 3px; font-weight: 700; }
.spec-value { font-size: 0.84rem; font-weight: 700; color: #1e293b; }

.struct-badge {
  display: inline-block;
  padding: 2px 8px; border-radius: 8px; font-size: 0.72rem; font-weight: 700;
}
.struct-免震 { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
.struct-制震 { background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd; }
.struct-新耐震 { background: #fef9c3; color: #a16207; border: 1px solid #fde047; }

.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.tag {
  background: #f1f5f9;
  color: #64748b;
  border: 1px solid #e2e8f0;
  padding: 2px 9px; border-radius: 20px; font-size: 0.7rem;
}

/* NAVI SCORE */
.score-section { margin-bottom: 4px; }
.score-label { font-size: 0.7rem; color: #be185d; margin-bottom: 6px; font-weight: 700; }
.scores { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; }
.score-item { text-align: center; }
.score-name { font-size: 0.6rem; color: #64748b; margin-bottom: 3px; }
.score-dots { display: flex; justify-content: center; gap: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.filled { background: #db2777; }
.dot.empty { background: #e2e8f0; }
.score-num { font-size: 0.74rem; font-weight: 700; color: #1e293b; margin-top: 2px; }

/* CARD FOOTER */
.card-footer {
  padding: 10px 15px;
  border-top: 1px solid #e2e8f0;
  display: flex; align-items: center; gap: 8px;
  background: #fafcff;
}
.publish-date {
  font-size: 0.72rem; color: #94a3b8;
  display: flex; align-items: center; gap: 4px;
}
.link-article {
  margin-left: auto;
  background: linear-gradient(135deg, #e879a0, #db2777);
  color: #fff;
  padding: 7px 16px; border-radius: 8px;
  font-size: 0.78rem; font-weight: 700;
  text-decoration: none; white-space: nowrap;
  transition: opacity .15s;
  box-shadow: 0 2px 6px rgba(219,39,119,0.2);
}
.link-article:hover { opacity: 0.85; }

/* COMPARE MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
  z-index: 100; overflow-y: auto; padding: 20px;
}
.modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
.modal {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 16px;
  max-width: 1200px; width: 100%; margin: auto;
  box-shadow: 0 24px 60px rgba(0,0,0,0.18);
}
.modal-header {
  background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
  color: #fff;
  padding: 16px 24px;
  border-radius: 16px 16px 0 0;
  border-bottom: 2px solid #db2777;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h2 { font-size: 1rem; }
.modal-close {
  background: rgba(255,255,255,0.15); border: none;
  color: #fff; width: 28px; height: 28px; border-radius: 50%;
  cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: rgba(219,39,119,0.4); }
.modal-body { overflow-x: auto; padding: 20px; }
.compare-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.compare-table th {
  background: #1e3a8a; color: #fff;
  padding: 10px 12px; text-align: center; white-space: nowrap;
  border-bottom: 2px solid #db2777;
}
.compare-table td {
  padding: 8px 12px; border-bottom: 1px solid #e2e8f0;
  vertical-align: top; color: #1e293b;
}
.compare-table tr:nth-child(even) td { background: #f8fafc; }
.compare-table td:first-child { font-weight: 600; color: #64748b; white-space: nowrap; width: 100px; }

/* AREA COLOR — 東京 vs 大阪 */
.card-tokyo {
  border-left: 4px solid #2563eb;
  background: linear-gradient(160deg, #ffffff 0%, #eff6ff 100%);
}
.card-tokyo:hover { border-color: #1d4ed8; box-shadow: 0 10px 28px rgba(37,99,235,0.12); }
.card-tokyo.selected { border-color: #1d4ed8; box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }
.card-tokyo .card-header { background: #eff6ff; border-bottom-color: #dbeafe; }
.card-area-label-tokyo {
  display: inline-block;
  background: #dbeafe; color: #1d4ed8;
  border: 1px solid #93c5fd;
  border-radius: 6px; padding: 2px 8px; font-size: 0.68rem; font-weight: 700;
}
.card-osaka {
  border-left: 4px solid #d97706;
  background: linear-gradient(160deg, #ffffff 0%, #fffbeb 100%);
}
.card-osaka:hover { border-color: #b45309; box-shadow: 0 10px 28px rgba(217,119,6,0.12); }
.card-osaka.selected { border-color: #b45309; box-shadow: 0 0 0 2px rgba(217,119,6,0.2); }
.card-osaka .card-header { background: #fffbeb; border-bottom-color: #fef3c7; }
.card-area-label-osaka {
  display: inline-block;
  background: #fef3c7; color: #b45309;
  border: 1px solid #fde68a;
  border-radius: 6px; padding: 2px 8px; font-size: 0.68rem; font-weight: 700;
}
.card-sendai {
  border-left: 4px solid #0d9488;
  background: linear-gradient(160deg, #ffffff 0%, #f0fdfa 100%);
}
.card-sendai:hover { border-color: #0f766e; box-shadow: 0 10px 28px rgba(13,148,136,0.12); }
.card-sendai.selected { border-color: #0f766e; box-shadow: 0 0 0 2px rgba(13,148,136,0.2); }
.card-sendai .card-header { background: #f0fdfa; border-bottom-color: #ccfbf1; }
.card-area-label-sendai {
  display: inline-block;
  background: #ccfbf1; color: #0f766e;
  border: 1px solid #5eead4;
  border-radius: 6px; padding: 2px 8px; font-size: 0.68rem; font-weight: 700;
}
.card-yokohama {
  border-left: 4px solid #7c3aed;
  background: linear-gradient(160deg, #ffffff 0%, #f5f3ff 100%);
}
.card-yokohama:hover { border-color: #6d28d9; box-shadow: 0 10px 28px rgba(124,58,237,0.12); }
.card-yokohama.selected { border-color: #6d28d9; box-shadow: 0 0 0 2px rgba(124,58,237,0.2); }
.card-yokohama .card-header { background: #f5f3ff; border-bottom-color: #ede9fe; }
.card-area-label-yokohama {
  display: inline-block;
  background: #ede9fe; color: #6d28d9;
  border: 1px solid #c4b5fd;
  border-radius: 6px; padding: 2px 8px; font-size: 0.68rem; font-weight: 700;
}
.card-nagoya {
  border-left: 4px solid #dc2626;
  background: linear-gradient(160deg, #ffffff 0%, #fef2f2 100%);
}
.card-nagoya:hover { border-color: #b91c1c; box-shadow: 0 10px 28px rgba(220,38,38,0.12); }
.card-nagoya.selected { border-color: #b91c1c; box-shadow: 0 0 0 2px rgba(220,38,38,0.2); }
.card-nagoya .card-header { background: #fef2f2; border-bottom-color: #fee2e2; }
.card-area-label-nagoya {
  display: inline-block;
  background: #fee2e2; color: #b91c1c;
  border: 1px solid #fca5a5;
  border-radius: 6px; padding: 2px 8px; font-size: 0.68rem; font-weight: 700;
}
.card-fukuoka {
  border-left: 4px solid #16a34a;
  background: linear-gradient(160deg, #ffffff 0%, #f0fdf4 100%);
}
.card-fukuoka:hover { border-color: #15803d; box-shadow: 0 10px 28px rgba(22,163,74,0.12); }
.card-fukuoka.selected { border-color: #15803d; box-shadow: 0 0 0 2px rgba(22,163,74,0.2); }
.card-fukuoka .card-header { background: #f0fdf4; border-bottom-color: #dcfce7; }
.card-area-label-fukuoka {
  display: inline-block;
  background: #dcfce7; color: #15803d;
  border: 1px solid #86efac;
  border-radius: 6px; padding: 2px 8px; font-size: 0.68rem; font-weight: 700;
}
.card-sapporo {
  border-left: 4px solid #0ea5e9;
  background: linear-gradient(160deg, #ffffff 0%, #f0f9ff 100%);
}
.card-sapporo:hover { border-color: #0284c7; box-shadow: 0 10px 28px rgba(14,165,233,0.12); }
.card-sapporo.selected { border-color: #0284c7; box-shadow: 0 0 0 2px rgba(14,165,233,0.2); }
.card-sapporo .card-header { background: #f0f9ff; border-bottom-color: #e0f2fe; }
.card-area-label-sapporo {
  display: inline-block;
  background: #e0f2fe; color: #0369a1;
  border: 1px solid #7dd3fc;
  border-radius: 6px; padding: 2px 8px; font-size: 0.68rem; font-weight: 700;
}
.card { position: relative; }

/* EMPTY */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="header-title">🏢 ハイグレードオフィスビル <span>比較ダッシュボード</span>｜オフィスナビ</div>
  </div>
  <div class="header-badge" id="totalBadge">40棟掲載中</div>
</header>

<div class="controls">
  <div class="control-group">
    <label>🔍 検索</label>
    <input type="text" id="searchInput" placeholder="ビル名・エリアで検索...">
  </div>
  <div class="control-group">
    <label>📍 エリア</label>
    <select id="areaFilter">
      <option value="">すべて</option>
      <option value="東京">東京</option>
      <option value="大阪">大阪</option>
      <option value="仙台">仙台</option>
      <option value="横浜">横浜</option>
      <option value="名古屋">名古屋</option>
      <option value="福岡">福岡</option>
      <option value="札幌">札幌</option>
    </select>
  </div>
  <div class="control-group">
    <label>🏗️ 構造</label>
    <select id="structFilter">
      <option value="">すべて</option>
      <option value="制震">制震</option>
      <option value="免震">免震</option>
      <option value="新耐震">新耐震</option>
    </select>
  </div>
  <div class="control-group">
    <label>📅 反映月</label>
    <select id="publishFilter">
      <option value="">すべて</option>
      <option value="2026/4">2026年4月</option>
      <option value="2026/5">2026年5月</option>
      <option value="2026/6">2026年6月</option>
      <option value="2026/7">2026年7月</option>
      <option value="2026/8">2026年8月</option>
      <option value="2026/9">2026年9月</option>
      <option value="2026/10">2026年10月</option>
    </select>
  </div>
  <div class="control-group">
    <label>⇅ ソート</label>
    <select id="sortSelect">
      <option value="default">標準順（公開日）</option>
      <option value="floor-desc">基準階（坪）大きい順</option>
      <option value="floors-desc">階数 多い順</option>
      <option value="completion-desc">竣工 新しい順</option>
      <option value="score-desc">Naviスコア合計 高い順</option>
    </select>
  </div>
  <span class="result-count" id="resultCount"></span>
  <button class="btn btn-compare" id="compareBtn" onclick="openCompare()" disabled>
    ✓ 選択したビルを比較（<span id="selectedCount">0</span>）
  </button>
  <div class="controls-break"></div>
  <button class="btn btn-reset" onclick="resetFilters()">条件リセット</button>
</div>

<div class="grid-wrap">
  <div class="grid" id="cardGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="emoji">🔍</div>
    <div>条件に一致するビルが見つかりません</div>
  </div>
</div>

<!-- COMPARE MODAL -->
<div class="modal-overlay" id="compareModal">
  <div class="modal">
    <div class="modal-header">
      <h2>📊 ビル比較ビュー</h2>
      <button class="modal-close" onclick="closeCompare()">✕</button>
    </div>
    <div class="modal-body">
      <table class="compare-table" id="compareTable"></table>
    </div>
  </div>

// 構造はデータ側で 制震 / 免震 / 新耐震 の3値に統一済み。表示時の変換はしない。
function normalizeStruct(s) {
  return s;
}

function dots(score) {
  return Array.from({length:5},(_,i)=>`<div class="dot ${i<score?'filled':'empty'}"></div>`).join('');
}
function scoreTotal(b) { return Object.values(b.scores).reduce((a,v)=>a+v,0); }
function floorNum(b) {
  const s = String(b.standardFloor || '');
  const t = s.match(/([\d,]+(?:\.\d+)?)\s*坪/);
  if (t) return parseFloat(t[1].replace(/,/g,''));
  const q = s.match(/([\d,]+(?:\.\d+)?)\s*㎡/);
  if (q) return parseFloat(q[1].replace(/,/g,'')) / 3.30578;
  return 0;
}
function parseYear(b) {
  const m = String(b.completion).match(/(\d{4})/);
  return m ? parseInt(m[1]) : 0;
}

    ? `<span class="card-area-label-fukuoka">🍜 福岡</span>`
    : b.area1 === '札幌'
    ? `<span class="card-area-label-sapporo">❄️ 札幌</span>`
    : '';
  return `<div class="card ${areaClass} ${isSelected?'selected':''}" id="card-${b.id}">
    <div class="card-header">
      <div class="card-header-info">
        <div class="area-badges">
          ${areaLabel}
          <span class="badge-area1">${b.area1}</span>
          <span class="badge-area2">${b.area2}</span>
        </div>
        <div class="card-name">${b.name}</div>
        <div class="card-name-en">${b.nameEn}</div>
      </div>
      <input type="checkbox" class="checkbox-compare" ${isSelected?'checked':''} onchange="toggleSelect(${b.id},this)" title="比較に追加">
    </div>
    <div class="card-body">
      <p class="card-desc">${b.description}</p>
      <div class="station-row"><span>🚇</span><span>${b.station}</span></div>
      <div class="spec-grid">
        <div class="spec-item"><div class="spec-label">🏢 階数</div><div class="spec-value">${b.floors}階</div></div>
        <div class="spec-item"><div class="spec-label">📐 基準階</div><div class="spec-value">${b.standardFloor || '—'}</div></div>
        <div class="spec-item"><div class="spec-label">🏗️ 構造</div><div class="spec-value">${b.structure ? `<span class="struct-badge struct-${b.structure}">${b.structure}</span>` : '—'}</div></div>
        <div class="spec-item"><div class="spec-label">📅 竣工</div><div class="spec-value">${b.completion}</div></div>
      </div>
      <div class="tags">${b.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="score-section">
        <div class="score-label">📊 Naviスコア</div>
        <div class="scores">
          ${Object.entries(b.scores).map(([k,v])=>`
            <div class="score-item">
              <div class="score-name">${k}</div>
              <div class="score-dots">${dots(v)}</div>
              <div class="score-num">${v}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card-footer">
      <span class="publish-date">📅 ${b.publishDate}</span>
      <a class="link-article" href="${b.articleUrl}" target="_blank">記事を見る →</a>
    </div>
  </div>`;
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const area = document.getElementById('areaFilter').value;
  const struct = document.getElementById('structFilter').value;
  const sort = document.getElementById('sortSelect').value;
  const pub = document.getElementById('publishFilter').value;

  let filtered = buildings.filter(b =>
    (!q || b.name.toLowerCase().includes(q) || b.area1.includes(q) || b.area2.includes(q) || b.description.includes(q)) &&
    (!area || b.area1 === area) &&
    (!struct || normalizeStruct(b.structure) === struct) &&
    (!pub || b.publishDate.startsWith(pub))
  );

  if (sort === 'floor-desc') filtered.sort((a,b)=>floorNum(b)-floorNum(a));
  else if (sort === 'floors-desc') filtered.sort((a,b)=>b.floors-a.floors);
  else if (sort === 'completion-desc') filtered.sort((a,b)=>parseYear(b)-parseYear(a));
  else if (sort === 'score-desc') filtered.sort((a,b)=>scoreTotal(b)-scoreTotal(a));

  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = filtered.map(makeCard).join('');
  }
  document.getElementById('resultCount').textContent = `表示中：${filtered.length} / ${buildings.length}棟`;
  document.getElementById('totalBadge').textContent = buildings.length + '棟掲載中';
  updateCompareBtn();
}

function toggleSelect(id, cb) {
  if (cb.checked) {
    if (selected.size >= 4) { cb.checked = false; alert('比較は最大4棟まで選択できます'); return; }
    selected.add(id);
    document.getElementById(`card-${id}`)?.classList.add('selected');
  } else {
    selected.delete(id);
    document.getElementById(`card-${id}`)?.classList.remove('selected');
  }
  updateCompareBtn();
}

function updateCompareBtn() {
  document.getElementById('selectedCount').textContent = selected.size;
  document.getElementById('compareBtn').disabled = selected.size < 2;
}

function openCompare() {
  if (selected.size < 2) return;
  const sel = buildings.filter(b => selected.has(b.id));
  const rows = [
    ['エリア', b => `${b.area1}・${b.area2}`],
    ['所在地', b => b.address],
    ['最寄駅', b => b.station],
    ['階数', b => `${b.floors}階`],
    ['基準階', b => b.standardFloor || '—'],
    ['構造', b => b.structure ? `<span class="struct-badge struct-${b.structure}">${b.structure}</span>` : '—'],
    ['竣工', b => b.completion],
    ['アクセス', b => `${'★'.repeat(b.scores['アクセス'])}${'☆'.repeat(5-b.scores['アクセス'])} (${b.scores['アクセス']})`],
    ['スペック', b => `${'★'.repeat(b.scores['スペック'])}${'☆'.repeat(5-b.scores['スペック'])} (${b.scores['スペック']})`],
    ['BCP', b => `${'★'.repeat(b.scores['BCP'])}${'☆'.repeat(5-b.scores['BCP'])} (${b.scores['BCP']})`],
    ['環境性能', b => `${'★'.repeat(b.scores['環境性能'])}${'☆'.repeat(5-b.scores['環境性能'])} (${b.scores['環境性能']})`],
    ['Naviスコア合計', b => `<strong>${scoreTotal(b)} / 20点</strong>`],
    ['反映年月日', b => b.publishDate],
    ['特徴', b => b.tags.map(t=>`<span class="tag">${t}</span>`).join(' ')],
    ['記事', b => `<a href="${b.articleUrl}" target="_blank" style="color:var(--accent2)">記事を見る →</a>`],
  ];

  let tableHtml = `<tr><th style="background:rgba(15,23,42,0.9)">項目</th>${sel.map(b=>`<th>${b.name}</th>`).join('')}</tr>`;
  rows.forEach(([label, fn]) => {
    tableHtml += `<tr><td>${label}</td>${sel.map(b=>`<td>${fn(b)}</td>`).join('')}</tr>`;
  });

  document.getElementById('compareTable').innerHTML = tableHtml;
  document.getElementById('compareModal').classList.add('active');
}

function closeCompare() {
  document.getElementById('compareModal').classList.remove('active');
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('areaFilter').value = '';
  document.getElementById('structFilter').value = '';
  document.getElementById('sortSelect').value = 'default';
  document.getElementById('publishFilter').value = '';
  selected.clear();
  updateCompareBtn();
  render();
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('areaFilter').addEventListener('change', render);
document.getElementById('structFilter').addEventListener('change', render);
document.getElementById('sortSelect').addEventListener('change', render);
document.getElementById('publishFilter').addEventListener('change', render);
document.getElementById('compareModal').addEventListener('click', e => {
  if (e.target === document.getElementById('compareModal')) closeCompare();
});

render();
</script>
</body>
</html>
